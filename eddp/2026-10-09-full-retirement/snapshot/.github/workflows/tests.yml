name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # The suite has no third-party dependencies; the modules under test are
      # standard library only. If that ever stops being true, this step is
      # where the requirements install belongs.
      - name: Run the suite
        run: python -m pytest -q

      - name: Confirm the integrated pipeline still runs end to end
        run: python eddp_pipeline.py
